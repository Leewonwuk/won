symbol: SOL
upbit_market: KRW-SOL
binance_symbol: SOLUSDT
fx_krw_per_usdt: 1500.0

entry_threshold_rate: 0.003
exit_threshold_rate: 0.0007
loop_interval_sec: 1.0
cooldown_sec: 5
trade_size_base: 20.0

fee_upbit_rate: 0.0005
fee_binance_rate: 0.0004
slippage_upbit_rate: 0.0008
slippage_binance_rate: 0.0008

# Example: fixed chain withdrawal fee in base units(SOL).
# The engine converts this into rate(%) by dividing by trade notional.
transfer_fee_upbit_to_binance_base: 0.01
transfer_fee_binance_to_upbit_base: 0.01

mode: paper
enable_live_orders: false
live_dry_run: true
order_timeout_sec: 3.0

risk:
  max_notional_krw: 5000000
  max_daily_loss_krw: 200000
  max_open_positions: 1

